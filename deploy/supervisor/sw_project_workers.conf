; Install only after production .env and database migrations are ready.
; Stop any local moderator using the same review bot before starting this one.
[program:sw_project_outbound]
directory=/var/www/sw_project/backend
command=/var/www/sw_project/venv/bin/python manage.py run_outbound_worker
user=django_user
environment=DJANGO_ENV="production",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true
umask=0027
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sw_project_outbound.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:sw_project_telegram_review]
directory=/var/www/sw_project/backend
command=/var/www/sw_project/venv/bin/python manage.py run_telegram_moderator
user=django_user
environment=DJANGO_ENV="production",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true
umask=0027
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sw_project_telegram_review.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
