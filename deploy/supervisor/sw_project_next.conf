; Current server: /var/www/sw_project, /usr/bin/node, django_user.
; Install only after npm ci/build succeeds and frontend production env is set.
; Existing Gunicorn remains managed by its original Supervisor program.
[program:sw_project_next]
directory=/var/www/sw_project/frontend
command=/usr/bin/node /var/www/sw_project/frontend/node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000
user=django_user
environment=NODE_ENV="production",BACKEND_URL="http://127.0.0.1:8000"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true
umask=0027
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sw_project_next.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
