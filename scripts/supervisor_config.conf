# Supervisor 配置文件模板
# 使用方法：
# 1. 将 /var/www/sw_project 替换为您的实际项目路径
# 2. 根据需要调整 workers 数量（建议：CPU核心数 * 2 + 1）
# 3. 复制到 /etc/supervisor/conf.d/sw_project.conf
# 4. 运行：sudo supervisorctl reread
# 5. 运行：sudo supervisorctl update
# 6. 启动服务：sudo supervisorctl start sw_project

[program:sw_project]
command=/var/www/sw_project/venv/bin/gunicorn shuwei.wsgi:application --bind 127.0.0.1:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -
directory=/var/www/sw_project/backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sw_project.log
stderr_logfile=/var/log/supervisor/sw_project_error.log
environment=PATH="/var/www/sw_project/venv/bin"

