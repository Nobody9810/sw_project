# Nginx 配置文件模板
# 使用方法：
# 1. 将 shuwei365.com 替换为您的实际域名
# 2. 将 /var/www/sw_project 替换为您的实际项目路径
# 3. 如果使用 HTTPS，配置 SSL 证书路径
# 4. 复制到 /etc/nginx/sites-available/sw_project
# 5. 创建符号链接：sudo ln -s /etc/nginx/sites-available/sw_project /etc/nginx/sites-enabled/
# 6. 测试配置：sudo nginx -t
# 7. 重载 Nginx：sudo systemctl reload nginx

# 上游服务器配置（Django/Gunicorn）
upstream django {
    server 127.0.0.1:8000;
}

# HTTP 服务器配置（重定向到 HTTPS）
# 如果暂时不使用 HTTPS，可以注释掉 return 301，使用下面的配置
server {
    listen 80;
    listen [::]:80;
    server_name shuwei365.com www.shuwei365.com;

    # 如果使用 HTTPS，取消下面的注释
    # return 301 https://$server_name$request_uri;
    
    # 如果暂时不使用 HTTPS，使用下面的配置（不推荐用于生产环境）
    # 请参考 HTTPS 配置部分
}

# HTTPS 服务器配置（推荐用于生产环境）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shuwei365.com www.shuwei365.com;

    # SSL 证书配置
    # 如果使用 Let's Encrypt，路径通常是：
    # ssl_certificate /etc/letsencrypt/live/shuwei365.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shuwei365.com/privkey.pem;
    
    # 如果使用其他证书，修改为实际路径
    ssl_certificate /etc/letsencrypt/live/shuwei365.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shuwei365.com/privkey.pem;
    
    # SSL 配置（安全最佳实践）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 日志配置
    access_log /var/log/nginx/sw_project_access.log;
    error_log /var/log/nginx/sw_project_error.log;

    # 客户端最大上传大小（用于文件上传）
    client_max_body_size 100M;

    # 前端静态文件根目录
    # 修改为您的实际前端构建输出目录
    root /var/www/sw_project/frontend/dist;
    index index.html;

    # =========================================
    # 重要：location 顺序很关键！
    # nginx 按以下顺序匹配 location：
    # 1. 精确匹配 =
    # 2. 前缀匹配（最长匹配优先）
    # 3. 正则匹配 ~ 和 ~*（按顺序匹配，一旦匹配就停止）
    # 4. 通用匹配 /
    # =========================================

    # Django 静态文件（admin, ckeditor 等）- 必须在正则匹配之前
    # 使用 ^~ 修饰符确保优先级最高，不会被正则匹配覆盖
    # 修改为您的实际静态文件目录
    location ^~ /static/ {
        alias /var/www/sw_project/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 确保文件存在，不存在返回404
        try_files $uri =404;
        # 添加访问日志以便调试
        access_log on;
    }

    # Django 媒体文件（用户上传的文件，包括PDF）- 必须在正则匹配之前
    # 使用 ^~ 修饰符确保优先级最高，不会被正则匹配覆盖
    # 修改为您的实际媒体文件目录
    location ^~ /media/ {
        alias /var/www/sw_project/backend/media/;
        expires 1y;
        add_header Cache-Control "public";
        # 添加访问日志以便调试
        access_log on;
        # 确保正确处理所有文件类型，包括 webp 和 pdf
        # 如果文件不存在，nginx 会自动返回 404
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 评论 API 代理
    location /comment/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # 互动 API 代理
    location /interactions/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django Admin 代理
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # CKEditor 上传接口
    location /ckeditor5/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # 文件上传需要更大的超时时间
        client_max_body_size 100M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 前端静态资源（CSS, JS, 图片等，包括PDF）
    # 注意：这个正则匹配用于处理前端dist目录下的静态资源
    # 由于 /static/ 和 /media/ 的前缀匹配location在前面，它们会优先匹配
    # 这个location只匹配其他路径下的静态资源（如前端dist目录下的文件）
    # 添加PDF到匹配列表，确保PDF文件可以正确加载
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端路由（React Router）
    # 所有前端路由都返回 index.html
    # 注意：这个必须放在最后，作为兜底路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}

