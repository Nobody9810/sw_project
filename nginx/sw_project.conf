# Current Next.js + Django production template.
# Match the domain, project directory, certificates and ports to your server.
# Run `sudo nginx -t` before reloading. Do not retain the old dist/index.html
# fallback, /assets/ static-file regex, or article-detail-to-Django regex.
upstream django {
    server 127.0.0.1:8000;
}
upstream nextjs {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name shuwei365.com www.shuwei365.com;
    return 301 https://shuwei365.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shuwei365.com www.shuwei365.com;

    ssl_certificate /etc/letsencrypt/live/shuwei365.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shuwei365.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # One public origin for login cookies, OAuth callbacks and article previews.
    if ($host = www.shuwei365.com) {
        return 301 https://shuwei365.com$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log /var/log/nginx/sw_project_access.log;
    error_log /var/log/nginx/sw_project_error.log;
    client_max_body_size 100M;

    # All proxy locations inherit these. Overwrite untrusted forwarding headers.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;
    proxy_cache off;
    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Current Django static storage does not fingerprint all filenames.
    location ^~ /static/ {
        alias /var/www/sw_project/backend/staticfiles/;
        expires 1h;
    }
    # sorl list thumbnails: hashed names whose content never changes.
    location ^~ /media/cache/ {
        alias /var/www/sw_project/backend/media/cache/;
        expires 30d;
    }
    location ^~ /media/ {
        alias /var/www/sw_project/backend/media/;
        expires 1h;
    }

    # No URI suffix on proxy_pass: retain the complete Django route.
    location ^~ /api/ { proxy_pass http://django; }
    location ^~ /comment/ { proxy_pass http://django; }
    location ^~ /interactions/ { proxy_pass http://django; }
    location ^~ /admin/ { proxy_pass http://django; }
    location ^~ /ckeditor5/ {
        proxy_pass http://django;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    location ^~ /accounts/ { proxy_pass http://django; }

    # The browser uses a trailing slash; allauth headless endpoints omit it.
    # Internal rewrite preserves POST bodies and query strings without redirect.
    location ^~ /_allauth/ {
        rewrite ^(/_allauth/.*)/$ $1 break;
        proxy_pass http://django;
    }

    # Includes /_next/, /assets/, fonts, PDF viewer assets and page requests.
    # Next.js must be running; frontend/dist is no longer a deployment target.
    location / { proxy_pass http://nextjs; }
}
