<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/assets/images/logo-icon-white.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="書味" />
    <title>書味</title>
    
    <!-- 1. 重置样式 -->
    <link rel="stylesheet" href="/assets/css/vendor/normalize.css">
    
    <!-- 3. Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- 5. 组件样式 -->
    <link rel="stylesheet" href="/assets/css/components/navbar.css">
    <link rel="stylesheet" href="/assets/css/components/search.css">
    <link rel="stylesheet" href="/assets/css/components/footer.css">
    <link rel="stylesheet" href="/assets/css/components/sidebar.css">
    <link rel="stylesheet" href="/assets/css/components/like-button.css">
    <link rel="stylesheet" href="/assets/css/components/comments.css">
    <link rel="stylesheet" href="/assets/css/components/qa.css">
    
    <!-- 6. 布局样式 -->
    <link rel="stylesheet" href="/assets/css/layouts/base.css">
    <link rel="stylesheet" href="/assets/css/layouts/article-detail.css">
    <link rel="stylesheet" href="/assets/css/layouts/article-list.css">
    <link rel="stylesheet" href="/assets/css/layouts/book-detail.css">
    <link rel="stylesheet" href="/assets/css/layouts/book-library.css">
    <link rel="stylesheet" href="/assets/css/layouts/about.css">
    
    <!-- 7. 主题样式 -->
    <link rel="stylesheet" href="/assets/css/themes/light.css">
    <link rel="stylesheet" href="/assets/css/themes/dark.css">
    
    <!-- 8. 页面样式 -->
    <link rel="stylesheet" href="/assets/css/pages/index.css">
    <link rel="stylesheet" href="/assets/css/pages/grid-list.css">
    
    <!-- dflip pdf阅读器-->
    <link href="/assets/dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <link href="/assets/dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">
    
    <!-- 阿拉伯语字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
    <style>
        html.theme-transition,
        html.theme-transition *,
        html.theme-transition *:before,
        html.theme-transition *:after {
            transition: none !important;
        }
        
        /* 防止布局闪烁 - 在CSS加载前就应用 */
        #root {
            width: 100%;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #root > div {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
        }
        
        main {
            flex: 1 0 auto;
            min-height: 60vh;
            width: 100%;
        }
        
        #footer {
            flex-shrink: 0 !important;
            flex-grow: 0 !important;
            position: relative !important;
            width: 100% !important;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            margin-bottom: 0 !important;
            order: 9999 !important;
            min-height: 200px !important;
            box-sizing: border-box !important;
            will-change: auto !important;
            transform: translateZ(0) !important;
            backface-visibility: hidden !important;
        }
        
        /* 确保Layout容器始终是flex */
        #root > div {
            display: flex !important;
            flex-direction: column !important;
            min-height: 100vh !important; /* 使用minHeight，允许超过视口高度 */
            width: 100% !important;
        }
        
        /* 确保main占据剩余空间 */
        main {
            flex: 1 0 auto !important; /* 占据剩余空间，可以增长 */
            min-height: calc(100vh - 500px) !important; /* 确保初始就有足够高度 */
            width: 100% !important;
            display: flex !important;
            flex-direction: column !important;
        }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- dflip pdf阅读器 - 必须在React应用加载前加载 -->
    <script src="/assets/dflip/js/libs/jquery.min.js" type="text/javascript"></script>
    <script src="/assets/dflip/js/libs/pdf.min.js" type="text/javascript"></script>
    <script src="/assets/dflip/js/libs/three.min.js" type="text/javascript"></script>
    <script src="/assets/dflip/js/dflip.min.js" type="text/javascript"></script>
    
    <!-- React应用 - 在所有依赖库加载后启动 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
